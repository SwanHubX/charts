name: 'Helm Chart Release'

on:
  push:
    branches:
      - main
  workflow_dispatch:

# 允许同时运行一个作业，并取消旧的作业
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4
        with:
          # 必须获取完整的 Git 历史，以便 chart-releaser 能够生成正确的 index 文件
          fetch-depth: 0

      - name: 🛠️ Set Git User
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: 🛠️ Set up Helm
        # helm v3.18+
        uses: azure/setup-helm@v4.3.0

      - name: 📥 Add Traefik Helm Repo
        run: |
          helm repo add traefik https://helm.traefik.io/traefik
          helm repo update

      - name: 🦢 Add SwanLab Helm Repo
        run: |
          helm repo add swanlab https://helm.swanlab.cn
          helm repo update

      - name: 🔍 Run Helm Lint
        run: |
          find ./charts -maxdepth 1 -mindepth 1 -type d | while read chart_dir; do
            echo "Linting $chart_dir..."
            helm dependency update "$chart_dir"
            helm lint "$chart_dir"
          done

#      - name: 👮 Move LICENSE to Chart Directories
#        run: |
#          find ./charts -maxdepth 1 -mindepth 1 -type d | while read chart_dir; do
#            echo "Copying LICENSE to $chart_dir..."
#            cp LICENSE "$chart_dir/"
#          done

      - name: 🚀 Release Helm Chart
        uses: helm/chart-releaser-action@v1.7.0
        with:
          charts_dir: ./charts
          skip_existing: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: 📦 Push Charts to Alibaba Cloud ACR (OCI)
        env:
          HELM_REPO_USERNAME: "${{ secrets.ACR_HELM_USERNAME }}"
          HELM_REPO_PASSWORD: "${{ secrets.ACR_HELM_PASSWORD }}"
          OCI_REGISTRY: "swanlab-registry.cn-hangzhou.cr.aliyuncs.com"
          HELM_EXPERIMENTAL_OCI: 1
        run: |
          helm dependency update ./charts/self-hosted

          # Login to ACR OCI registry
          echo "$HELM_REPO_PASSWORD" | helm registry login "$OCI_REGISTRY" \
            --username "$HELM_REPO_USERNAME" \
            --password-stdin

          # Package chart
          CHART_VERSION=$(yq '.version' ./charts/self-hosted/Chart.yaml)
          CHART_ARCHIVE="./charts/self-hosted-${CHART_VERSION}.tgz"
          helm package ./charts/self-hosted -d ./charts

          # Push to OCI registry (namespace-level only, Helm auto-creates repo by chart name)
          OCI_PUSH_REF="oci://${OCI_REGISTRY}/swanlab"
          PUSH_OUTPUT=$(helm push "$CHART_ARCHIVE" "$OCI_PUSH_REF" 2>&1) || {
            if echo "$PUSH_OUTPUT" | grep -qi "already exists"; then
              echo "Chart self-hosted:$CHART_VERSION already exists in ACR, skipping push"
              helm registry logout "$OCI_REGISTRY" 2>/dev/null || true
              exit 0
            else
              echo "$PUSH_OUTPUT"
              helm registry logout "$OCI_REGISTRY" 2>/dev/null || true
              exit 1
            fi
          }
          echo "$PUSH_OUTPUT"

          helm registry logout "$OCI_REGISTRY"
