apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "swanlab.next.fullname" . }}
  labels:
  {{- include "swanlab.next.labels" . | nindent 4 }}
  {{- with (include "swanlab.next.annotations" . | trim) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ default 0 .Values.service.next.replicas }}
  selector:
    matchLabels:
    {{- include "swanlab.next.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
      {{- include "swanlab.next.labels" . | nindent 8 }}
      {{- with (include "swanlab.next.podLabels" . | trim) }}
        {{- . | nindent 8 }}
      {{- end }}
      {{- with (include "swanlab.next.podAnnotations" . | trim) }}
      annotations:
        {{- . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "swanlab.podSecurityContext" (dict "root" . "securityContext" .Values.service.next.securityContext "uid" 1001 "gid" 1001) | nindent 6 }}
      {{- include "swanlab.podAntiAffinity" (list .Values.global.podAntiAffinityPreset "swanlab.next.selectorLabels" . ) | nindent 6 }}
      {{- with (include "swanlab.next.nodeSelector" . | trim) }}
      nodeSelector:
        {{- . | nindent 8 }}
      {{- end }}
      {{- with (include "swanlab.next.tolerations" . | trim) }}
      tolerations:
        {{- . | nindent 8 }}
      {{- end }}
      restartPolicy: Always
      imagePullSecrets:
      {{- include "swanlab.imagePullSecrets" . | nindent 8 }}
      initContainers:
        - name: ping
          env:
            - name: SWANLAB_SERVER_URL
              value: "http://{{ include "swanlab.server.fullname" . }}:{{ include "swanlab.server.port" . }}/api"
            - name: SWANLAB_CLOUD_URL
              value: "http://{{ include "swanlab.cloud.fullname" . }}:{{include "swanlab.cloud.port" . }}"
            - name: SWANLAB_HOUSE_URL
              value: "http://{{ include "swanlab.house.fullname" . }}:{{include "swanlab.house.port" . }}/api/house"
          image: {{ include "swanlab.helperImage" . }}
          imagePullPolicy: {{ include "swanlab.helperPullPolicy" . }}
          command: [ "/bin/sh", "-c" ]
          args:
            - |
              # Function to parse HTTP URL and check TCP connectivity
              check_url() {
                service_name=$1
                url=$2

                if [ -z "$url" ]; then
                  echo "⚪ $service_name URL not set, skipping check."
                  return
                fi

                # --- URL Parsing ---
                # 1. Remove protocol (http:// or https://)
                tmp="${url#*://}"
                # 2. Remove path suffix (e.g., /api, /, or query params)
                tmp="${tmp%%/*}"

                # 3. Extract Host and Port
                # Get content before the last colon
                host="${tmp%:*}"
                # Get content after the last colon
                port="${tmp##*:}"

                # If host equals port, it means no port was specified in URL (e.g. http://example.com/api)
                # Default to 80 in that case
                if [ "$host" = "$port" ]; then
                  port="80"
                fi

                # --- Check Logic ---
                echo "➡️  Checking $service_name ($host:$port)..."
                until nc -z -w 1 "$host" "$port"; do
                  echo "   ⏳ Waiting for $service_name to be ready..."
                  sleep 2
                done
                echo "✅ $service_name is ready!"
              }

              echo "🔍 Starting service connectivity check..."

              # Check SwanLab Server (removes /api automatically)
              check_url "SwanLab Server" "$SWANLAB_SERVER_URL"

              # Check SwanLab Cloud
              check_url "SwanLab Cloud" "$SWANLAB_CLOUD_URL"

              # Check SwanLab House (removes /api/house automatically)
              check_url "SwanLab House" "$SWANLAB_HOUSE_URL"

              echo "🎉 All services are reachable!"
          {{- include "swanlab.containerSecurityContext" (dict "root" . "securityContext" .Values.service.next.securityContext) | nindent 10 }}
      containers:
        - name: server
          image: {{ include "swanlab.next.image" . | quote }}
          imagePullPolicy: {{ .Values.service.next.image.pullPolicy }}
          ports:
            - containerPort: 3000
              name: web
          env:
            - name: CLOUD_URL
              value: "http://{{ include "swanlab.cloud.fullname" . }}:{{include "swanlab.cloud.port" . }}"
            - name: API_URL
              value: "http://{{ include "swanlab.gateway.fullname" . }}:{{ include "swanlab.gateway.internal" . }}/api"
            - name: API_VERIFIER_URL
              value: {{ include "swanlab.server.identify" . | quote }}
            - name: API_INTERNAL_URL
              value: "http://{{ include "swanlab.gateway.fullname" . }}:{{ include "swanlab.gateway.internal" . }}/api"
            {{- with .Values.global.settings.host }}
            - name: API_DISPLAY_HOST
              value: {{ . | quote }}
            {{- end }}
          {{- include "swanlab.containerSecurityContext" (dict "root" . "securityContext" .Values.service.next.securityContext) | nindent 10 }}
        {{- if .Values.service.next.resources }}
          resources:
        {{- toYaml .Values.service.next.resources | nindent 12 }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "swanlab.next.fullname" . }}
  labels:
  {{- include "swanlab.next.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
  {{- include "swanlab.next.selectorLabels" . | nindent 4 }}
  ports:
    - port: {{ include "swanlab.next.port" . }}
      targetPort: web
