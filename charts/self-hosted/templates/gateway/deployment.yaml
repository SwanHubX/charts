apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "swanlab.gateway.fullname" . }}
  labels:
  {{- include "swanlab.gateway.labels" . | nindent 4 }}
  {{- with (include "swanlab.gateway.annotations" . | trim) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ default 1 .Values.gateway.replicas }}
  selector:
    matchLabels:
    {{- include "swanlab.gateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
      {{- include "swanlab.gateway.labels" . | nindent 8 }}
      {{- with (include "swanlab.gateway.podLabels" . | trim) }}
        {{- . | nindent 8 }}
      {{- end }}
      annotations:
        # 实现configmap变化后自动滚动更新，避免出现配置更新后网关不生效的问题
        checksum/swanlab-gateway-configmap: {{ include (print .Template.BasePath "/gateway/config.yaml") . | sha256sum }}
        {{ with (include "swanlab.gateway.podAnnotations" . | trim) }}
        {{- . | nindent 8 }}
        {{ end }}
    spec:
      {{- include "swanlab.podAntiAffinity" (list .Values.global.podAntiAffinityPreset "swanlab.gateway.selectorLabels" . ) | nindent 6 }}
      {{- with (include "swanlab.gateway.nodeSelector" . | trim) }}
      nodeSelector:
        {{- . | nindent 8 }}
      {{- end }}
      {{- with (include "swanlab.gateway.tolerations" . | trim) }}
      tolerations:
        {{- . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: download-identify
          image: "{{ .Values.gateway.identifyImage.repository }}:{{ .Values.gateway.identifyImage.tag }}"
          env:
            - name: COPY_TO
              # The download-identify script automatically creates the 'identify' folder in the /plugins-tmp directory.
              value: /plugins-tmp
          volumeMounts:
            - name: identify-plugin
              # Mount path for the shared volume
              mountPath: /plugins-tmp
      restartPolicy: Always
      imagePullSecrets:
      {{- include "swanlab.imagePullSecrets" . | nindent 8 }}
      containers:
        - name: traefik
          image: "{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag }}"
          args:
            - "--configfile=/etc/traefik/traefik.yaml"
          ports:
            - name: web
              containerPort: {{ include "swanlab.gateway.web" . }}
            - name: internal
              containerPort: {{ include "swanlab.gateway.internal" . }}
            - name: traefik
              containerPort: {{ include "swanlab.gateway.traefik" . }}
            - name: metrics
              containerPort: {{ include "swanlab.gateway.metrics" . }}
          volumeMounts:
            - name: config
              mountPath: "/etc/traefik/traefik.yaml"
              subPath: "traefik.yaml"
            - name: config
              mountPath: "/etc/traefik/dynamic/dynamic.yaml"
              subPath: "dynamic.yaml"
            - name: identify-plugin
              mountPath: /plugins-local/src/github.com/swanhubx/swanlab-helper
        {{- if .Values.gateway.resources }}
          resources:
        {{- toYaml .Values.gateway.resources | nindent 12 }}
        {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "swanlab.gateway.configmap" . }}
        - name: identify-plugin
          emptyDir: { }
---

apiVersion: v1
kind: Service
metadata:
  name: {{ include "swanlab.gateway.fullname" . }}
  labels:
  {{- include "swanlab.gateway.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
  {{- include "swanlab.gateway.selectorLabels" . | nindent 4 }}
  ports:
    - port: {{ include "swanlab.gateway.web" . }}
      name: web
    - port: {{ include "swanlab.gateway.internal" . }}
      name: internal
