{{- if .Values.integrations.s3.enabled | eq false }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "swanlab.s3.fullname" . }}
  labels:
  {{- include "swanlab.s3.labels" . | nindent 4 }}
  {{- with (include "swanlab.s3.annotations" . | trim) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  selector:
    matchLabels:
    {{- include "swanlab.s3.selectorLabels" . | nindent 6 }}
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
      {{- include "swanlab.s3.labels" . | nindent 8 }}
      {{- with (include "swanlab.s3.podLabels" . | trim) }}
        {{- . | nindent 8 }}
      {{- end }}
      {{- with (include "swanlab.s3.podAnnotations" . | trim) }}
      annotations:
        {{- . | nindent 8 }}
      {{- end }}
    spec:
      {{- with (include "swanlab.podSecurityContext" (dict "root" . "securityContext" .Values.dependencies.s3.securityContext "uid" 1000 "gid" 1000) | trim) }}
      {{- . | nindent 6 }}
      {{- end }}
      restartPolicy: Always
      imagePullSecrets:
      {{- include "swanlab.imagePullSecrets" . | nindent 8 }}
      {{- with (include "swanlab.s3.nodeSelector" . | trim) }}
      nodeSelector:
        {{- . | nindent 8 }}
      {{- end }}
      {{- with (include "swanlab.s3.tolerations" . | trim) }}
      tolerations:
        {{- . | nindent 8 }}
      {{- end }}
      {{- with (include "swanlab.volumePermissionsInit" (dict "root" . "sc" .Values.dependencies.s3.securityContext "uid" 1000 "gid" 1000 "volumeName" (printf "%s-volume" (include "swanlab.s3.fullname" .)) "mountPath" "/data") | trim) }}
      initContainers:
        {{- . | nindent 8 }}
      {{- end }}
      containers:
      - name: s3
        image: "{{ .Values.dependencies.s3.image.repository }}:{{ .Values.dependencies.s3.image.tag }}"
        imagePullPolicy: {{ .Values.dependencies.s3.image.pullPolicy }}
        ports:
          - containerPort: 9000
            name: minio
          - containerPort: 9001
            name: minio-console
        args:
          - "server"
          - "/data"
          - "--console-address"
          - ":9001"
        env:
          - name: TZ
            value: "UTC"
          - name: MINIO_ROOT_USER
            valueFrom:
              secretKeyRef:
                name: {{ include "swanlab.s3.secretName" . }}
                key: accessKey
          - name: MINIO_ROOT_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ include "swanlab.s3.secretName" . }}
                key: secretKey
        volumeMounts:
          - mountPath: /data
            name: {{ include "swanlab.s3.fullname" . }}-volume
        {{- with (include "swanlab.containerSecurityContext" (dict "root" . "securityContext" .Values.dependencies.s3.securityContext) | trim) }}
        {{- . | nindent 8 }}
        {{- end }}
        {{- if .Values.dependencies.s3.resources }}
        resources:
        {{- toYaml .Values.dependencies.s3.resources | nindent 12 }}
        {{- end }}
      volumes:
        - name: {{ include "swanlab.s3.fullname" . }}-volume
          persistentVolumeClaim:
            claimName: {{ include "swanlab.s3.pvcName" . }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "swanlab.s3.fullname" . }}
  labels:
  {{- include "swanlab.s3.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
  {{- include "swanlab.s3.selectorLabels" . | nindent 4 }}
  ports:
    - port: {{ include "swanlab.s3.minio.port" . }}
      name: minio
    - port: 9001
      name: minio-console
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "swanlab.s3.fullname" . }}-init-buckets
spec:
  ttlSecondsAfterFinished: 3600
  completions: 1
  template:
    spec:
      {{- with (include "swanlab.podSecurityContext" (dict "root" . "securityContext" .Values.dependencies.s3.securityContext "uid" 1000 "gid" 1000) | trim) }}
      {{- . | nindent 6 }}
      {{- end }}
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-minio
          image: {{ include "swanlab.helperImage" . }}
          imagePullPolicy: {{ include "swanlab.helperPullPolicy" . }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              MINIO_SERVICE_HOST=$(echo $MINIO_ENDPOINT | awk -F'//' '{print $2}' | awk -F':' '{print $1}')
              MINIO_SERVICE_PORT=$(echo $MINIO_ENDPOINT | awk -F':' '{print $3}')
              echo "Checking MinIO Server at ${MINIO_SERVICE_HOST}:${MINIO_SERVICE_PORT}..."
              while ! nc -z -w 2 ${MINIO_SERVICE_HOST} ${MINIO_SERVICE_PORT}; do
              echo "MinIO Service not ready, waiting 5 seconds..."
              sleep 5
              done
              echo "MinIO Service is up!"
          env:
            - name: MINIO_ENDPOINT
              value: "http://{{ include "swanlab.s3.fullname" . }}:{{ include "swanlab.s3.minio.port" . }}"
          {{- with (include "swanlab.containerSecurityContext" (dict "root" . "securityContext" .Values.dependencies.s3.securityContext) | trim) }}
          {{- . | nindent 10 }}
          {{- end }}
      containers:
        - name: minio-mc-job
          image: "{{ .Values.dependencies.s3.mcImage.repository }}:{{ .Values.dependencies.s3.mcImage.tag }}"
          imagePullPolicy: {{ .Values.dependencies.s3.mcImage.pullPolicy }}
          env:
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "swanlab.s3.secretName" . }}
                  key: secretKey
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "swanlab.s3.secretName" . }}
                  key: accessKey
            - name: MINIO_ENDPOINT
              value: "http://{{ include "swanlab.s3.fullname" . }}:{{ include "swanlab.s3.minio.port" . }}"
            - name: MINIO_PRIVATE_BUCKET
              value: "{{ include "swanlab.s3.private.bucket" . }}"
            - name: MINIO_PUBLIC_BUCKET
              value: "{{ include "swanlab.s3.public.bucket" . }}"
            {{- if .Values.dependencies.s3.securityContext.enabled }}
            # 非 root 运行时 mc 无法写默认 HOME（/root），重定向到 /tmp，否则 mc alias set 失败
            - name: HOME
              value: /tmp
            {{- end }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              # 1. set alias
              mc alias set swanlab-minio $MINIO_ENDPOINT $MINIO_ROOT_USER $MINIO_ROOT_PASSWORD

              # 2. private bucket
              mc mb --ignore-existing swanlab-minio/$MINIO_PRIVATE_BUCKET
              mc anonymous set private swanlab-minio/$MINIO_PRIVATE_BUCKET

              # 3. public bucket
              mc mb --ignore-existing swanlab-minio/$MINIO_PUBLIC_BUCKET
              mc anonymous set public swanlab-minio/$MINIO_PUBLIC_BUCKET
          {{- with (include "swanlab.containerSecurityContext" (dict "root" . "securityContext" .Values.dependencies.s3.securityContext) | trim) }}
          {{- . | nindent 10 }}
          {{- end }}
{{- end }}
