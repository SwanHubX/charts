{{- if .Values.integrations.postgres.enabled | eq false }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "swanlab.postgres.fullname" . }}
  labels:
  {{- include "swanlab.postgres.labels" . | nindent 4 }}
  {{- with (include "swanlab.postgres.annotations" . | trim) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  selector:
    matchLabels:
    {{- include "swanlab.postgres.selectorLabels" . | nindent 6 }}
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
      {{- include "swanlab.postgres.labels" . | nindent 8 }}
      {{- with (include "swanlab.postgres.podLabels" . | trim) }}
        {{- . | nindent 8 }}
      {{- end }}
      {{- with (include "swanlab.postgres.podAnnotations" . | trim) }}
      annotations:
        {{- . | nindent 8 }}
      {{- end }}
    spec:
      restartPolicy: Always
      imagePullSecrets:
      {{- include "swanlab.imagePullSecrets" . | nindent 8 }}
      {{- with (include "swanlab.postgres.nodeSelector" . | trim) }}
      nodeSelector:
        {{- . | nindent 8 }}
      {{- end }}
      {{- with (include "swanlab.postgres.tolerations" . | trim) }}
      tolerations:
        {{- . | nindent 8 }}
      {{- end }}
      {{- include "swanlab.podSecurityContext" (dict "root" . "uid" 999 "gid" 999) | nindent 6 }}
      # 预创建 subPath；卷的组权限由 fsGroup 处理，不再使用 root chown。
      initContainers:
        - name: init-postgres-fs
          image: {{ include "swanlab.helperImage" . }}
          imagePullPolicy: {{ include "swanlab.helperPullPolicy" . }}
          command:
            - "sh"
            - "-c"
            - "mkdir -p /var/lib/postgresql/data"
          {{- include "swanlab.containerSecurityContext" (dict "root" .) | nindent 10 }}
          volumeMounts:
            - name: {{ include "swanlab.postgres.fullname" . }}-volume
              mountPath: /var/lib/postgresql
      containers:
      - name: postgres
        image: "{{ .Values.dependencies.postgres.image.repository }}:{{ .Values.dependencies.postgres.image.tag }}"
        imagePullPolicy: {{ .Values.dependencies.postgres.image.pullPolicy }}
        ports:
          - containerPort: {{ include "swanlab.postgres.port" . }}
            name: postgres
        env:
          - name: TZ
            value: "UTC"
          - name: PGDATA
            value: /var/lib/postgresql/data
          - name: POSTGRES_DB
            value: {{ include "swanlab.postgres.database" . }}
          - name: POSTGRES_USER
            valueFrom:
              secretKeyRef:
                name: {{ include "swanlab.postgres.secretName" . }}
                key: username
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ include "swanlab.postgres.secretName" . }}
                key: password
        volumeMounts:
          # 确保挂载路径正确，且与 initContainer 中一致，避免挂载到临时盘导致数据丢失
          - mountPath: /var/lib/postgresql/data
            subPath: data
            name: {{ include "swanlab.postgres.fullname" . }}-volume
        {{- include "swanlab.containerSecurityContext" (dict "root" .) | nindent 8 }}
        {{- if .Values.dependencies.postgres.resources }}
        resources:
        {{- toYaml .Values.dependencies.postgres.resources | nindent 12 }}
        {{- end }}
      volumes:
        - name: {{ include "swanlab.postgres.fullname" . }}-volume
          persistentVolumeClaim:
            claimName: {{ include "swanlab.postgres.pvcName" . }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "swanlab.postgres.fullname" . }}
  labels:
  {{- include "swanlab.postgres.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
  {{- include "swanlab.postgres.selectorLabels" . | nindent 4 }}
  ports:
    - port: {{ include "swanlab.postgres.port" . }}
      name: postgres
{{- end }}
