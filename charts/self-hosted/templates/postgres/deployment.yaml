{{- if .Values.integrations.postgres.enabled | eq false }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "swanlab.postgres.fullname" . }}
  labels:
  {{- include "swanlab.postgres.labels" . | nindent 4 }}
  {{- with (include "swanlab.postgres.annotations" . | trim) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  selector:
    matchLabels:
    {{- include "swanlab.postgres.selectorLabels" . | nindent 6 }}
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
      {{- include "swanlab.postgres.labels" . | nindent 8 }}
      {{- with (include "swanlab.postgres.podLabels" . | trim) }}
        {{- . | nindent 8 }}
      {{- end }}
      {{- with (include "swanlab.postgres.podAnnotations" . | trim) }}
      annotations:
        {{- . | nindent 8 }}
      {{- end }}
    spec:
      restartPolicy: Always
      imagePullSecrets:
      {{- include "swanlab.imagePullSecrets" . | nindent 8 }}
      {{- with (include "swanlab.postgres.nodeSelector" . | trim) }}
      nodeSelector:
        {{- . | nindent 8 }}
      {{- end }}
      {{- with (include "swanlab.postgres.tolerations" . | trim) }}
      tolerations:
        {{- . | nindent 8 }}
      {{- end }}
      {{- if .Values.dependencies.postgres.securityContext.enabled }}
      # 注意：开启加固后卷权限完全依赖 fsGroup + OnRootMismatch（subPath 内已存在的目录不受递归修正），
      # 实测部分存储类/CSI 下 fsGroup 不可靠，此类环境请保持 securityContext.enabled=false
      {{- with (include "swanlab.podSecurityContext" (dict "root" . "securityContext" .Values.dependencies.postgres.securityContext "uid" 999 "gid" 999) | trim) }}
      {{- . | nindent 6 }}
      {{- end }}
      {{- else }}
      # 部分存储类创建的卷权限不是 postgres 用户可写，使用 initContainer 修正权限
      # 实测部分存储、k8s版本下单纯设置 fsGroup 无效，需要用 initContainer 修改目录属主
      securityContext:
        fsGroup: 999
      {{- end }}
      initContainers:
      {{- with (include "swanlab.volumePermissionsInit" (dict "root" . "sc" .Values.dependencies.postgres.securityContext "uid" 999 "gid" 999 "volumeName" (printf "%s-volume" (include "swanlab.postgres.fullname" .)) "mountPath" "/var/lib/postgresql") | trim) }}
      {{- . | nindent 8 }}
      {{- end }}
        - name: init-postgres-fs
          image: {{ include "swanlab.helperImage" . }}
          imagePullPolicy: {{ include "swanlab.helperPullPolicy" . }}
          command:
            - "sh"
            - "-c"
            {{- if .Values.dependencies.postgres.securityContext.enabled }}
            - >-
              mkdir -p /var/lib/postgresql/data &&
              true
            {{- else }}
            - "mkdir -p /var/lib/postgresql/data && chmod 700 /var/lib/postgresql/data && chown -R 999:999 /var/lib/postgresql/data"
            {{- end }}
          {{- if .Values.dependencies.postgres.securityContext.enabled }}
          {{- with (include "swanlab.containerSecurityContext" (dict "root" . "securityContext" .Values.dependencies.postgres.securityContext) | trim) }}
          {{- . | nindent 10 }}
          {{- end }}
          {{- else }}
          securityContext:
            runAsUser: 0
          {{- end }}
          volumeMounts:
            - name: {{ include "swanlab.postgres.fullname" . }}-volume
              mountPath: /var/lib/postgresql
      containers:
      - name: postgres
        image: "{{ .Values.dependencies.postgres.image.repository }}:{{ .Values.dependencies.postgres.image.tag }}"
        imagePullPolicy: {{ .Values.dependencies.postgres.image.pullPolicy }}
        ports:
          - containerPort: {{ include "swanlab.postgres.port" . }}
            name: postgres
        env:
          - name: TZ
            value: "UTC"
          - name: PGDATA
            value: /var/lib/postgresql/data
          - name: POSTGRES_DB
            value: {{ include "swanlab.postgres.database" . }}
          - name: POSTGRES_USER
            valueFrom:
              secretKeyRef:
                name: {{ include "swanlab.postgres.secretName" . }}
                key: username
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ include "swanlab.postgres.secretName" . }}
                key: password
        volumeMounts:
          # 确保挂载路径正确，且与 initContainer 中一致，避免挂载到临时盘导致数据丢失
          - mountPath: /var/lib/postgresql/data
            subPath: data
            name: {{ include "swanlab.postgres.fullname" . }}-volume
        {{- if .Values.dependencies.postgres.securityContext.enabled }}
        {{- with (include "swanlab.containerSecurityContext" (dict "root" . "securityContext" .Values.dependencies.postgres.securityContext) | trim) }}
        {{- . | nindent 8 }}
        {{- end }}
        {{- end }}
        {{- if .Values.dependencies.postgres.resources }}
        resources:
        {{- toYaml .Values.dependencies.postgres.resources | nindent 12 }}
        {{- end }}
      volumes:
        - name: {{ include "swanlab.postgres.fullname" . }}-volume
          persistentVolumeClaim:
            claimName: {{ include "swanlab.postgres.pvcName" . }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "swanlab.postgres.fullname" . }}
  labels:
  {{- include "swanlab.postgres.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
  {{- include "swanlab.postgres.selectorLabels" . | nindent 4 }}
  ports:
    - port: {{ include "swanlab.postgres.port" . }}
      name: postgres
{{- end }}
