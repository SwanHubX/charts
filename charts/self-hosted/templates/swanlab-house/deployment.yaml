apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "%s" (include "swanlab.house.fullname" .) }}
  labels:
  {{- include "swanlab.house.labels" . | nindent 4 }}
  {{- with (include "swanlab.house.annotations" . | trim) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}

spec:
  replicas: {{ default 0 .Values.service.house.replicas }}
  selector:
    matchLabels:
    {{- include "swanlab.house.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
      {{- include "swanlab.house.labels" . | nindent 8 }}
      {{- with (include "swanlab.house.podLabels" . | trim) }}
        {{- . | nindent 8 }}
      {{- end }}
      {{- with (include "swanlab.house.podAnnotations" . | trim) }}
      annotations:
        {{- . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "swanlab.podSecurityContext" (dict "root" . "securityContext" .Values.service.house.securityContext "uid" 65532 "gid" 65532) | nindent 6 }}
      {{- include "swanlab.podAntiAffinity" (list .Values.global.podAntiAffinityPreset "swanlab.house.selectorLabels" . ) | nindent 6 }}
      {{- with (include "swanlab.house.nodeSelector" . | trim) }}
      nodeSelector:
        {{- . | nindent 8 }}
      {{- end }}
      {{- with (include "swanlab.house.tolerations" . | trim) }}
      tolerations:
        {{- . | nindent 8 }}
      {{- end }}
      imagePullSecrets:
      {{- include "swanlab.imagePullSecrets" . | nindent 8 }}
      initContainers:
        - name: ping
          image: {{ include "swanlab.helperImage" . }}
          imagePullPolicy: {{ include "swanlab.helperPullPolicy" . }}
          env:
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "swanlab.redis.secretName" . }}
                  key: url
            - name: CLICKHOUSE_HOST
              value: {{ include "swanlab.clickhouse.host" . | quote }}
            - name: CLICKHOUSE_PORT
              value: {{ include "swanlab.clickhouse.tcpPort" . | quote }}
            - name: VECTOR_HOST
              value: {{ include "swanlab.vector.host" . | quote }}
            - name: VECTOR_PORT
              value: {{ include "swanlab.vector.httpPort" . | quote }}
          command: [ "/bin/sh", "-c" ]
          args:
            - |
              echo "🔍 Starting dependency check..."

              # ---------------------------------------------------------
              # 1. Parse Redis URL (extract host and port from redis://user:pass@host:port/db)
              # ---------------------------------------------------------
              tmp="${REDIS_URL#*://}"
              tmp="${tmp%%/*}"
              host_port="${tmp##*@}"

              r_host="${host_port%:*}"
              r_port="${host_port##*:}"

              if [ "$r_host" = "$r_port" ]; then
              r_port="6379"
              fi

              echo "➡️ Checking Redis ($r_host:$r_port)..."
              until nc -z -w 1 "$r_host" "$r_port"; do
              echo "   Waiting for Redis to be ready..."
              sleep 2
              done
              echo "✅ Redis is ready!"

              # ---------------------------------------------------------
              # 2. Check ClickHouse
              # ---------------------------------------------------------
              echo "➡️ Checking ClickHouse ($CLICKHOUSE_HOST:$CLICKHOUSE_PORT)..."
              until nc -z -w 1 "$CLICKHOUSE_HOST" "$CLICKHOUSE_PORT"; do
              echo "   Waiting for ClickHouse to be ready..."
              sleep 2
              done
              echo "✅ ClickHouse is ready!"

              # ---------------------------------------------------------
              # 3. Check Vector
              # ---------------------------------------------------------
              echo "➡️ Checking Vector ($VECTOR_HOST:$VECTOR_PORT)..."
              until nc -z -w 1 "$VECTOR_HOST" "$VECTOR_PORT"; do
              echo "   Waiting for Vector to be ready..."
              sleep 2
              done
              echo "✅ Vector is ready!"

              echo "🎉 All dependencies are ready. Proceeding to main container..."
          {{- include "swanlab.containerSecurityContext" (dict "root" . "securityContext" .Values.service.house.securityContext) | nindent 10 }}
      containers:
        - name: house
          image: {{ include "swanlab.house.image" . | quote }}
          imagePullPolicy: {{ .Values.service.house.image.pullPolicy }}
          ports:
            - containerPort: 3000
              name: house
          env:
            # K8s downward API：kubelet 注入 pod 名，不调 API server
            # 应用读取 POD_NAME 暴露 swanlab_pod_info{pod=...}=1, 供 Grafana join 显示 pod 名
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SH_VECTOR_ENABLE
              value: "true"
            - name: SH_VECTOR_TIMEOUT
              value: "30s"
            - name: SH_VECTOR_URL
              value: "http://{{ include "swanlab.vector.fullname" . }}:{{ include "swanlab.vector.httpPort" . }}"
            - name: SH_API_PREFIX
              value: "/api/house"
            - name: SH_DISTRIBUTED_ENABLE
              value: "true"
            - name: SH_SERVER_URL
              value: "http://{{ include "swanlab.server.fullname" . }}:{{ include "swanlab.server.port" . }}/api"
            - name: SH_DB_HOST
              value: "{{ include "swanlab.clickhouse.host" . }}"
            - name: SH_DB_PORT
              value: "{{ include "swanlab.clickhouse.tcpPort" . }}"
            - name: SH_DB_NAME
              value: "{{ include "swanlab.clickhouse.database" . }}"
            - name: SH_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "swanlab.clickhouse.secretName" . }}
                  key: username
            - name: SH_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "swanlab.clickhouse.secretName" . }}
                  key: password
            - name: SH_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "swanlab.redis.secretName" . }}
                  key: url
            - name: SH_FLAG_ID_IGNORE
              value: "true"
            - name: SH_MINIO_ENDPOINT
              value: "{{ include "swanlab.s3.private.endpoint" . }}:{{ include "swanlab.s3.private.port" . }}"
            - name: SH_MINIO_USE_SSL
              value: {{ include "swanlab.s3.private.ssl" . | quote }}
            - name: SH_MINIO_REGION
              value: {{ include "swanlab.s3.private.region" . | quote }}
            - name: SH_MINIO_PATH_STYLE
              value: {{ include "swanlab.s3.private.pathStyle" . | quote }}
            - name: SH_MINIO_PRIVATE_BUCKET
              value: "{{ include "swanlab.s3.private.bucket" . }}"
            - name: SH_MINIO_SECRET_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "swanlab.s3.secretName" .}}
                  key: accessKey
            - name: SH_MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "swanlab.s3.secretName" .}}
                  key: secretKey
          volumeMounts:
            - name: house-workdir
              mountPath: /app/playground
          {{- include "swanlab.containerSecurityContext" (dict "root" . "securityContext" .Values.service.house.securityContext) | nindent 10 }}
        {{- if .Values.service.house.resources }}
          resources:
        {{- toYaml .Values.service.house.resources | nindent 12 }}
        {{- end }}
      volumes:
        - name: house-workdir
          emptyDir: {}

---

apiVersion: v1
kind: Service
metadata:
  name: {{ include "swanlab.house.fullname" . }}
  labels:
  {{- include "swanlab.house.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  {{- with .Values.service.house.clusterIP }}
  clusterIP: {{ . }}
  {{- end }}
  selector:
  {{- include "swanlab.house.selectorLabels" . | nindent 4 }}
  ports:
    - port: {{ include "swanlab.house.port" . }}
      targetPort: house
