{{/*
Monitor Headless Service for SwanLab-Auth

仅用于 Prometheus dns_sd_configs 发现所有 Pod IP。
- clusterIP: None → DNS A 记录返回每个 Pod IP（而非一个 VIP）
- 零业务流量：不分配 VIP、不写 iptables，kube-proxy 不参与
- 选中与主 Service 相同的 Pod，通过 .Values.service.auth.monitor.enable 开关控制
*/}}
{{- if .Values.service.auth.monitor.enable }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "swanlab.auth.fullname" . }}-monitor
  labels:
  {{- include "swanlab.auth.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
  {{- include "swanlab.auth.selectorLabels" . | nindent 4 }}
  ports:
    - port: {{ include "swanlab.auth.port" . }}
      targetPort: auth
{{- end }}
