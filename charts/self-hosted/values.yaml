# Configuration for internal-deployed infrastructure (Chart-managed services).
# These components serve as the default application dependencies and are only
# provisioned in the cluster if the corresponding 'integrations.<service>.enabled' is false.
dependencies:
  postgres: # PostgreSQL Database Configuration
    fullnameOverride: ""
    securityContext:
      enabled: false
    image: # Image Configuration
      # Full image repository path (e.g., ghcr.io/cloudnative-pg/postgresql)
      repository: repo.swanlab.cn/self-hosted/postgres
      # Image tag/version to use. We RECOMMEND using 16.x+ for SwanLab.
      tag: "16.1"
      # Kubernetes image pull policy (Always, IfNotPresent, Never).
      pullPolicy: "IfNotPresent"
    username: ""
    password: ""
    persistence: # Persistent Storage Configuration
      # Kubernetes StorageClass to use for dynamic provisioning.
      storageClass: ""
      # Volume size for the database data.
      storageSize: "10Gi"
      # Use an existing PVC by name (leave empty to create a new one)
      existingClaim: ""
    customLabels: {}
    customAnnotations: {}
    customPodLabels: {}
    customPodAnnotations: {}
    customTolerations: []
    customNodeSelector: {}
    resources: {}
    # Dedicated headless Service for metrics scraping (does not affect business traffic on the main Service)
    #   true = create a <fullname>-monitor headless Service so the postgres-exporter in the telemetry layer can discover the PG Pod
    #   Only takes effect when not using an external managed instance (integrations.postgres.enabled = false)
    monitor:
      enable: false
  redis: # Redis Configuration
    fullnameOverride: ""
    securityContext:
      enabled: false
    image: # Image Configuration
      # Full image repository path (e.g., redis/redis-stack)
      repository: repo.swanlab.cn/self-hosted/redis-stack
      # Image tag/version to use.
      tag: "7.4.0-v8"
      # Kubernetes image pull policy (Always, IfNotPresent, Never).
      pullPolicy: "IfNotPresent"
    persistence: # Persistent Storage Configuration
      aof:
        enabled: false
        appendFsync: everysec
      storageClass: ""
      storageSize: "10Gi"
      # Use an existing PVC by name (leave empty to create a new one)
      existingClaim: ""
    customLabels: {}
    customAnnotations: {}
    customPodLabels: {}
    customPodAnnotations: {}
    customTolerations: []
    customNodeSelector: {}
    resources: {}
    # Dedicated headless Service for metrics scraping (does not affect business traffic on the main Service)
    #   true = create a <fullname>-monitor headless Service so the redis-exporter in the telemetry layer can discover the Redis Pod
    #   Only takes effect when not using an external managed instance (integrations.redis.enabled = false)
    monitor:
      enable: false
  clickhouse: # ClickHouse Configuration
    fullnameOverride: ""
    securityContext:
      enabled: false
    image: # Image Configuration
      # Full image repository path (e.g., clickhouse/clickhouse-server)
      repository: repo.swanlab.cn/self-hosted/clickhouse-server
      # Image tag/version to use.
      tag: "24.3"
      pullPolicy: "IfNotPresent"
    # Authentication credentials.
    # Leave empty if using existingSecret.
    username: ""
    password: ""
    persistence: # Persistent Storage Configuration
      storageClass: ""
      storageSize: "20Gi"
      # Use an existing PVC by name (leave empty to create a new one)
      existingClaim: ""
    customLabels: {}
    customAnnotations: {}
    customPodLabels: {}
    customPodAnnotations: {}
    customTolerations: []
    customNodeSelector: {}
    resources: {}
    # Dedicated headless Service for metrics scraping (does not affect business traffic on the main Service)
    #   true  = create a <fullname>-monitor headless Service so Prometheus dns_sd can discover all Pod IPs
    #   false = do not create it (discover Pods yourself via kubernetes_sd_configs or other means)
    #   Only takes effect when not using an external managed instance (integrations.clickhouse.enabled = false)
    monitor:
      enable: false
  s3: # MinIO Object Storage Service
    fullnameOverride: ""
    securityContext:
      enabled: false
    image: # Image Configuration
      # Full image repository path (e.g., minio/minio)
      repository: repo.swanlab.cn/self-hosted/minio/minio
      # Image tag/version to use.
      tag: "RELEASE.2025-09-07T16-13-09Z"
      pullPolicy: "IfNotPresent"
    mcImage: # MinIO Client Image Configuration
      # Full image repository path (e.g., minio/mc)
      repository: repo.swanlab.cn/self-hosted/minio/mc
      # Image tag/version to use.
      tag: "RELEASE.2025-08-13T08-35-41Z"
      pullPolicy: "IfNotPresent"
    accessKey: ""
    # If left empty, a secure secret key will be generated.
    secretKey: ""
    persistence: # Persistent Storage Configuration
      storageClass: ""
      storageSize: "20Gi"
      # Use an existing PVC by name (leave empty to create a new one)
      existingClaim: ""
    customLabels: {}
    customAnnotations: {}
    customPodLabels: {}
    customPodAnnotations: {}
    customTolerations: []
    customNodeSelector: {}
    resources: {}
# Configuration of external-deployed infrastructure
integrations:
  postgres:
    # Enable to use an external PostgreSQL database.
    enabled: false
    host: ""
    port: 5432
    database: "app"
    # (Optional) Use an existing Secret for connection strings.
    # If set, 'primaryUrl' and 'replicaUrl' values above will be ignored.
    #
    # | .data.<key> in Secret |
    # |:----------------------|
    # | username              |
    # | password              |
    # | primaryUrl            |
    # | replicaUrl            |
    existingSecret: ""
  redis:
    # Enable to use an external Redis service.
    enabled: false
    host: ""
    port: 6379
    database: 0
    # (Optional) Use an existing Secret for the Redis URL.
    # If set, the 'url' value above will be ignored.
    #
    # | .data.<key> in Secret |
    # |:----------------------|
    # | url                   |
    existingSecret: ""
  clickhouse:
    # Enable to use an external ClickHouse server.
    enabled: false
    host: ""
    httpPort: 8123
    tcpPort: 9000
    database: "app"
    # (Optional) Use an existing Secret for authentication.
    # If set, 'user', 'password', 'host', 'httpPort', and 'database' values above will be ignored.
    #
    # | .data.<key> in Secret |
    # |:----------------------|
    # | username              |
    # | password              |
    existingSecret: ""
  s3:
    # Enable to use an external S3-compatible object storage.
    enabled: false
    public:
      ssl: true
      endpoint: ""
      region: ""
      port: 443
      domain: ""
      pathStyle: true
      bucket: ""
    private:
      ssl: true
      endpoint: ""
      region: ""
      port: 443
      pathStyle: true
      bucket: ""
    # (Optional) Use an existing Secret for S3 credentials.
    # If set, 'accessKey' and 'secretKey' values above will be ignored.
    #
    # |.data.<key> in Secret |type                  |
    # |:---------------------|----------------------|
    # | accessKey            | string               |
    # | secretKey            | string               |
    existingSecret: ""
